services:
  # Backend Service
  - type: web
    name: financial-agent-backend
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free # or starter
    
    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # Or specific render domain
      # Add other keys like QDRANT_URL, GROQ_API_KEY here or in Render Dashboard

  # Frontend Service
  - type: web
    name: financial-agent-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    
    # Environment variables
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: financial-agent-backend
          property: url

version: "1"
