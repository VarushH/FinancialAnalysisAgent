version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: finance_agent_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backups:/app/backups # Persist backups if needed, though mostly using Qdrant cloud
    environment:
      - PYTHONUNBUFFERED=1
      # Add API keys here or use .env file
      # - OPENAI_API_KEY=${OPENAI_API_KEY} 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - financial-agent-net

  frontend:
    build: 
      context: ./frontend
    container_name: finance_agent_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - financial-agent-net

networks:
  financial-agent-net:
    driver: bridge
