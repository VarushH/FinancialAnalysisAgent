
services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backups:/app/backups # Persist backups if needed, though mostly using Qdrant cloud
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - financial-agent-net

  frontend:
    build:
      context: ./frontend

    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - financial-agent-net

networks:
  financial-agent-net:
    driver: bridge
